name: check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux media runtimes
        run: sudo apt-get update && sudo apt-get install -y libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libmpv-dev ffmpeg libwebkit2gtk-4.1-dev libgtk-3-dev
      - name: Cargo check (clippy-clean, tests)
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
  # The desktop packages whatever the pinned tv submodule builds. Without
  # this job the shell could pass CI while the UI it bundles fails its own
  # pin checks, typecheck, tests or production build.
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tv/package-lock.json
      - name: Pinned tv-web build (pin checks, typecheck, tests, bundle)
        run: |
          npm ci --prefix tv
          npm test --prefix tv
          npm run build --prefix tv
